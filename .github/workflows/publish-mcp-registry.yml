name: validate-mcp-registry

# validate: registry metadata check on pull requests and main.
# publish: runs after publish-npm succeeds on a tag, and only when that exact
# version is on npm. The first publish of a new name is manual, so until then
# the job skips with a notice instead of failing the release.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - publish-npm
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/validate-package-metadata.mjs --require-built
      - run: npm pack --dry-run

  publish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Check this version is on npm
        id: npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match package version $version" >&2
            exit 1
          fi
          if [ "$(npm view "@hmrdkn-labs/pos-satpam@$version" version 2>/dev/null)" = "$version" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=MCP registry publish skipped::@hmrdkn-labs/pos-satpam@$version is not on npm yet. Publish it to npm first, then publish server.json by hand or rerun this workflow."
          fi
      - if: steps.npm.outputs.published == 'true'
        run: node scripts/validate-package-metadata.mjs --tag "$TAG"
      - name: Install mcp-publisher
        if: steps.npm.outputs.published == 'true'
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.16/mcp-publisher_linux_amd64.tar.gz
          echo "6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - if: steps.npm.outputs.published == 'true'
        run: ./mcp-publisher validate server.json
      - if: steps.npm.outputs.published == 'true'
        run: ./mcp-publisher login github-oidc
      - if: steps.npm.outputs.published == 'true'
        run: ./mcp-publisher publish server.json
